[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tf4dgs"
version = "0.1.0"
description = "Temporal Fields 4D Gaussian Splatting: capture and analysis foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tf4dgs = "tf4dgs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tf4dgs = ["assets/*.html"]
